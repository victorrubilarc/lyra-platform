name: Release

# Publica las imágenes a GHCR al empujar un tag de versión (vX.Y.Z) y despliega
# en el EC2 por SSH. La web se construye con URLs same-origin (relativas, /api),
# así la MISMA imagen sirve cualquier dominio detrás del proxy de borde.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # HAS_COSIGN gobierna si se firma (sin el secret, la firma se omite sin romper).
    # A nivel de job para que lo vean tanto el paso de instalar cosign como el de firmar.
    env:
      HAS_COSIGN: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile.api
            target: runtime
          - name: migrate
            dockerfile: docker/Dockerfile.api
            target: migrate
          - name: web
            dockerfile: docker/Dockerfile.web
            target: runtime
    steps:
      - uses: actions/checkout@v4

      # Licenciamiento L3: el build de RELEASE embebe la clave pública de
      # PRODUCCIÓN (scripts/license/prod-keys/) reescribiendo la constante
      # compilada ANTES del docker build — sustitución en build, jamás por env
      # en runtime. Desde aquí las imágenes publicadas SÍ son distribuibles
      # comercialmente (solo aceptan licencias firmadas por la privada de PROD
      # bajo custodia). dev/CI no corren este paso: siguen con la pública DEV.
      - name: Embeber clave pública de PRODUCCIÓN (Licenciamiento L3)
        run: node scripts/license/embed-public-key.mjs

      - uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lyra-watchlog-${{ matrix.name }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=stable

      - name: Fecha de build (UTC, ISO-8601)
        id: bd
        run: echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build & push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Metadatos de versión para la imagen web (los ignora la api). Permiten mostrar
          # versión + fecha + commit en «Acerca de». El tag git es la versión visible.
          build-args: |
            VITE_APP_VERSION=${{ github.ref_name }}
            VITE_GIT_SHA=${{ github.sha }}
            VITE_BUILD_DATE=${{ steps.bd.outputs.iso }}

      # Firma de imagen con cosign por DIGEST (E3 · cadena de suministro). Key-based
      # (NO keyless): `--tlog-upload=false` ⇒ verificable OFFLINE con la pública
      # committeada (scripts/license/cosign/README.md). La firma queda como artefacto
      # OCI junto a la imagen en GHCR. GUARDADA por el secret: sin COSIGN_PRIVATE_KEY
      # la firma se OMITE (deuda, como L1 antes de L3) y el release sigue. cosign v2.x
      # (v3 rompió --tlog-upload=false). Ver docs/DECISIONS.md 2026-07-08 E3.
      - name: Instalar cosign (v2, air-gap-compatible)
        if: ${{ env.HAS_COSIGN == 'true' }}
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.3'
      - name: Firmar la imagen por digest
        if: ${{ env.HAS_COSIGN == 'true' }}
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if [ -z "$COSIGN_KEY" ]; then
            echo "⏭  Sin COSIGN_PRIVATE_KEY — firma de imagen OMITIDA (deuda E3; completar ceremonia de custodia)."
            exit 0
          fi
          printf '%s' "$COSIGN_KEY" > /tmp/cosign.key
          IMG="ghcr.io/${{ github.repository_owner }}/lyra-watchlog-${{ matrix.name }}@${DIGEST}"
          echo "▶ firmando $IMG"
          cosign sign --yes --key /tmp/cosign.key --tlog-upload=false "$IMG"
          rm -f /tmp/cosign.key
          echo "✅ imagen firmada (verificable offline con la pública)."

  # ── GATE de vulnerabilidades (H2) ───────────────────────────────────────────
  # Escanea las imágenes recién publicadas con Trivy y BLOQUEA el release si queda
  # algún CRÍTICO sin excepción documentada en .trivyignore. `bundle` y `deploy`
  # dependen de este job ⇒ un crítico nuevo detiene TANTO el paquete offline como
  # el auto-deploy al EC2. El reporte (dist/trivy/) se sube como artefacto para que
  # `bundle` lo adjunte al paquete sin re-escanear. Ver docs/SECURITY.md §9.2.
  scan:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Login a GHCR (pull de las imágenes del tag)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Trivy GATE (CRÍTICO bloquea; excepciones en .trivyignore)
        run: GATE=critical SRC_PREFIX=ghcr.io/${{ github.repository_owner }}/ bash scripts/scan-images.sh ${{ github.ref_name }}
      - name: Subir reporte Trivy (para el paquete offline)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: dist/trivy/
          retention-days: 30

  # ── Paquete OFFLINE air-gapped (E2) ─────────────────────────────────────────
  # Tras el GATE, arma el `.tar.gz` autocontenido (imágenes como tar con NOMBRE
  # NEUTRO + infra + compose standalone + install.sh + guía + reporte Trivy +
  # SHA256SUMS) y lo ADJUNTA al GitHub Release del tag. El SOCIO de canal lo
  # descarga UNA vez (con internet) y lo lleva por USB a la planta. Cero fuente:
  # las imágenes ya vienen selladas (L5) y sin `src/`.
  bundle:
    needs: [build, scan]
    runs-on: ubuntu-latest
    # Firma del paquete offline (E3): igual que el build, gobernada por el secret.
    env:
      HAS_COSIGN: ${{ secrets.COSIGN_PRIVATE_KEY != '' }}
    permissions:
      contents: write   # crear/actualizar el Release y subir el asset
      packages: read     # pull de las imágenes recién publicadas
    steps:
      - uses: actions/checkout@v4
      - name: Login a GHCR (pull de las imágenes del tag)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Reusa el reporte del job `scan` (ya pasó el gate) → dist/trivy/, que
      # make-bundle copia a SECURITY/. Evita re-escanear.
      - name: Descargar reporte Trivy del gate
        uses: actions/download-artifact@v4
        with:
          name: trivy-report
          path: dist/trivy/
      # cosign para firmar el SHA256SUMS del paquete (sign-blob, verificable OFFLINE).
      # Sin el secret, make-bundle omite la firma sin romper (deuda E3).
      - name: Instalar cosign (v2, air-gap-compatible)
        if: ${{ env.HAS_COSIGN == 'true' }}
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.3'
      - name: Generar paquete offline (firmado si hay clave)
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: SRC_PREFIX=ghcr.io/${{ github.repository_owner }}/ bash scripts/make-bundle.sh ${{ github.ref_name }}
      # SBOM CycloneDX por imagen (E3): además de viajar DENTRO del paquete
      # (SECURITY/sbom/), se adjunta suelto al Release para que el auditor del
      # cliente lo descargue sin desempacar el bundle. Ver docs/SECURITY.md §9.1.
      - name: Empaquetar SBOMs (CycloneDX) para el Release
        run: |
          if [ -d dist/trivy/sbom ]; then
            tar -czf dist/lyra-watchlog-${{ github.ref_name }}-sbom.tar.gz -C dist/trivy sbom
          fi
      - name: Adjuntar paquete + SBOM al GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lyra-watchlog-${{ github.ref_name }}.tar.gz
            dist/lyra-watchlog-${{ github.ref_name }}-sbom.tar.gz
          fail_on_unmatched_files: true

  # ── Deploy automático al EC2 (máquina compartida con ruta-bus) ───────────────
  # Tras publicar las imágenes, entra por SSH y corre update.sh (pull → migrate
  # deploy → up -d → healthcheck con rollback). Requiere los secrets del repo:
  # DEPLOY_SSH_HOST, DEPLOY_SSH_USER, DEPLOY_SSH_KEY, DEPLOY_DIR.
  deploy:
    needs: [build, scan]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-watchlog-prod
      cancel-in-progress: false
    steps:
      - name: Update por SSH en el EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_DIR }}"
            # Invocado con `bash` (no `./`) para no depender del bit ejecutable del script:
            # un re-clone/pull en el EC2 lo resetea a 100644 y `./onprem/update.sh` daría 126.
            bash onprem/update.sh ${{ github.ref_name }}
