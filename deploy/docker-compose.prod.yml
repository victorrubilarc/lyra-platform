# ─────────────────────────────────────────────────────────────────────────────
# Lyra WatchLog — stack de PRODUCCIÓN para AWS (máquina compartida con otros
# proyectos). Imágenes versionadas desde GHCR (build-once en CI; ver
# .github/workflows/release.yml). NO publica 80/443: el TLS y el enrutamiento por
# subdominio los hace un Caddy de BORDE COMPARTIDO (el de ruta-bus), que alcanza
# este stack por la red externa `edge` (alias `watchlog-web`). Postgres/Redis/MinIO
# son DEDICADOS a WatchLog (aislados de los otros proyectos).
#
#   despliegue:  ./onprem/update.sh v1.0.0     (lo invoca el GitHub Action por SSH)
#   manual:      docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Requisitos en el host (una sola vez): `docker network create edge` y enganchar el
# Caddy de ruta-bus a esa red + bloque del subdominio (ver docs/DEPLOYMENT.md).
# ─────────────────────────────────────────────────────────────────────────────
name: lyra-watchlog

# ── Endurecimiento CIS Docker Benchmark (H2 2026-07-07) ──────────────────────
# MISMA postura que el compose standalone (deploy/standalone/docker-compose.yml):
# non-root, no-new-privileges, cap_drop, read_only + tmpfs y pins por digest. Se
# mantiene en paridad para que el demo sea representativo de lo que se entrega.
x-no-new-privs: &no-new-privs
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    # Pin por DIGEST (índice multi-arch) — reproducibilidad/SLSA (H2).
    image: postgres:16-alpine@sha256:7a396fd264a2067788b6551122b50f162bf6136312c7fc9d74381cb92c648382
    restart: unless-stopped
    # Tope de memoria por servicio (aislamiento por cgroup): si una app se fuga, el
    # kernel OOM-mata SOLO su contenedor (se reinicia solo) y no toca a la app vecina
    # del EC2 compartido. Los topes son TECHOS, no reservas; el uso real es ~10× menor.
    mem_limit: 512m
    mem_reservation: 256m
    # CIS 5.25/5.3: el entrypoint arranca root para chownear PGDATA y baja a
    # `postgres` con gosu — solo esas 5 capabilities se conservan.
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
      TZ: "${TZ:-America/Santiago}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /tmp
      - /var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine@sha256:b1addbe72465a718643cff9e60a58e6df1841e29d6d7d60c9a85d8d72f08d1a7
    restart: unless-stopped
    # 384m (no 256m): el --maxmemory interno ya es 256mb; un tope de 256m mataría a
    # Redis al sumar overhead + el fork del bgsave (appendonly). 384m da aire.
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    read_only: true
    tmpfs:
      - /tmp
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  minio:
    # Pin por DIGEST a la release más reciente (H2): reproducibilidad; los CVE
    # residuales van en .trivyignore (MinIO 100% interno, no alcanzable).
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:9966a92a734f9411e32f4f41d7d9d826fcdc0f68c4e20b70295bd4e7c11f8a2f
    restart: unless-stopped
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    volumes:
      - miniodata:/data
    networks: [internal]

  # Init container: aplica migraciones (migrate deploy) + seed de CATÁLOGO en
  # cada deploy (idempotente; JAMÁS crea usuarios — el primer admin lo crea el
  # asistente de primer arranque /setup con su token; ver DEPLOYMENT.md).
  migrate:
    image: ${WL_REGISTRY:-ghcr.io}/${WL_OWNER}/lyra-watchlog-migrate:${WL_VERSION:-stable}
    restart: "no"
    mem_limit: 512m
    # CIS 5.25/5.3/5.12: non-root (uid 1000 horneado), sin nuevos privilegios,
    # sin capabilities, root FS de solo-lectura (escribe solo /tmp).
    <<: *no-new-privs
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    env_file: .env
    environment:
      NODE_ENV: "production"
      TZ: "${TZ:-America/Santiago}"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  api:
    image: ${WL_REGISTRY:-ghcr.io}/${WL_OWNER}/lyra-watchlog-api:${WL_VERSION:-stable}
    restart: unless-stopped
    mem_limit: 512m
    # CIS 5.25/5.3/5.12: non-root (uid 1000), sin nuevos privilegios, sin
    # capabilities, root FS de solo-lectura. Escribe SOLO /app/license (bind rw,
    # el host lo deja a uid 1000 vía onprem/update.sh) y /tmp (tmpfs).
    <<: *no-new-privs
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
    env_file: .env
    environment:
      NODE_ENV: "production"
      API_PORT: "3000"
      # V8 hace GC antes del tope del cgroup (el OOM-kill de cgroup es SIGKILL, no grácil).
      NODE_OPTIONS: "--max-old-space-size=384"
      TZ: "${TZ:-America/Santiago}"
      LICENSE_FILE: "/app/license/license.lic"
    volumes:
      # Huella node-lock (L1): el machine-id del HOST, no el del contenedor —
      # sin este mount la huella cambia en cada `down/up` y mata la licencia.
      - /etc/machine-id:/etc/machine-id:ro
      # Carpeta de licencia (rw): aquí se importa license.lic y la app deja
      # solicitud.lreq cuando aún no hay licencia (ceremonia de activación).
      - ./license:/app/license
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Healthcheck con node (la imagen slim NO trae wget/curl; node sí).
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]

  # Caddy interno: sirve la SPA y proxea /api → api:3000 (HTTP en la red interna).
  # El Caddy de BORDE (ruta-bus) le hace TLS y le manda watchlog.itesicws.com.
  # OJO: el servicio se llama `watchlog-web` (NO `web`) a propósito: la red `edge`
  # es COMPARTIDA con ruta-bus, que también tiene un servicio `web` (su POS). Si
  # este se llamara `web`, el Caddy de borde (en ambas redes) resolvería `web`
  # ambiguamente y rompería el POS de ruta-bus. El nombre único lo evita.
  watchlog-web:
    image: ${WL_REGISTRY:-ghcr.io}/${WL_OWNER}/lyra-watchlog-web:${WL_VERSION:-stable}
    restart: unless-stopped
    mem_limit: 128m
    # CIS 5.25/5.3/5.12: Caddy como uid 1000 (horneado), sin nuevos privilegios,
    # root FS de solo-lectura. cap_drop:[ALL] + cap_add:[NET_BIND_SERVICE] (la
    # única cap, mínima para bindear :80: el binario oficial de Caddy la lleva como
    # file-cap y con bounding set vacío el execve daría EPERM; el sysctl hace el
    # bind bajo no-new-privileges). H2 Opción A: paridad con el standalone.
    # Stateless (no ACME): /tmp, /config, /data por tmpfs (últimos con mode 1777).
    <<: *no-new-privs
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    tmpfs:
      - /tmp
    volumes:
      - type: tmpfs
        target: /config
        tmpfs: { mode: 0o1777 }
      - type: tmpfs
        target: /data
        tmpfs: { mode: 0o1777 }
    environment:
      # TLS lo hace el Caddy de borde; aquí solo HTTP interno en :80 (sin publicar puerto).
      SITE_ADDRESS: ":80"
      TZ: "${TZ:-America/Santiago}"
    depends_on:
      api:
        condition: service_healthy
    networks:
      internal: {}
      edge: {}

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  # Red privada de WatchLog (postgres/redis/minio/api/web se ven entre sí).
  internal: {}
  # Red compartida con el Caddy de borde (ruta-bus). Se crea una vez en el host:
  #   docker network create edge
  edge:
    external: true
